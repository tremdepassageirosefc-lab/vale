<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vale CineLivre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: orgulhosa e acolhedora, um presente da Vale para a comunidade
   IDEA: a locomotiva que leva cinema a todo lugar, com as faixas da pintura do trem
   PICTURE: a foto do trem ao pôr do sol em tela cheia, faixas verde/branco/amarelo
   COLOUR/TYPE: verde Vale #019285, amarelo #e9ab22, cinza #77787b; Big Shoulders + Inter
   LAYOUT: topo branco com o logo, capa grande, fileiras de filmes em verde profundo */
:root{--bg:#04201e;--bg2:#0a3532;--ink:#f3f7f6;--mut:#a9c3bf;--red:#019285;--cream:#e9ab22;--gray:#77787b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px max(4vw,14px);background:#fff;box-shadow:0 2px 14px #0003}
.logo{display:flex;align-items:center;gap:10px;margin-right:8px}
.logo img{height:44px;width:auto;display:block}
.logo span{font:900 30px/1 'Big Shoulders Display',sans-serif;color:var(--red);letter-spacing:.5px;padding-left:10px;border-left:2px solid #e3e3e3}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--gray);padding:10px 12px;border-radius:8px;min-height:44px;font-weight:600}
nav button.on{color:#fff;background:var(--red)}
.search{flex:1 1 220px;display:flex}
.search input{width:100%;min-height:44px;border-radius:10px;border:1px solid #d6dcdb;background:#f3f6f5;color:#1d2b2a;padding:0 14px;font-size:16px}
.hero{position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#04201e;padding:24px 0}
.hero .blur{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) brightness(.5) saturate(1.2)}
.frame{position:relative;z-index:1;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #000a;max-width:calc(100% - 28px)}
.frame .foto{display:block;height:min(80vh,900px);width:auto;max-width:100%;object-fit:contain}
.badge{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;background:#fffffff2;padding:8px 14px;border-radius:12px;box-shadow:0 6px 20px #0006}
.badge img{height:44px;width:auto;display:block}
.badge span{font:900 24px/1 'Big Shoulders Display',sans-serif;color:var(--red);padding-left:8px;border-left:2px solid #e3e3e3}
.cta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:18px max(4vw,14px);background:var(--bg2)}
.cta .now{margin:0}
.now{font-size:14px;color:var(--mut)}.now b{color:var(--ink)}
.stripes{height:18px;background:linear-gradient(var(--red) 0 33%,#fff 33% 52%,var(--cream) 52% 100%)}
.stats{display:flex;flex-wrap:wrap;gap:12px 40px;padding:22px max(4vw,14px);background:var(--bg2)}
.stats div{font-size:14px;color:var(--mut)}.stats b{display:block;font:900 30px/1 'Big Shoulders Display',sans-serif;color:var(--cream)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:0;font-weight:600}
.play{background:var(--cream);color:#1d1a10}
.ghost{background:#ffffff1f;color:var(--ink)}
.red{background:var(--red);color:#fff}
main{padding-bottom:60px}
.row{padding:18px 0 4px}
.row h2{font:900 26px/1.1 'Big Shoulders Display',sans-serif;margin:0 max(4vw,14px) 10px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px max(4vw,14px) 12px;scroll-snap-type:x mandatory}
.card{flex:none;width:clamp(130px,16vw,180px);scroll-snap-align:start;background:none;border:0;color:var(--ink);text-align:left;padding:0}
.card .img{aspect-ratio:2/3;border-radius:10px;background:#0f4540 center/cover;box-shadow:0 6px 18px #0008;transition:transform .2s}
.card:hover .img{transform:scale(1.04)}
.card b{display:block;font-size:14px;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;padding:16px max(4vw,14px)}
.grid .card{width:auto}
.panel{padding:24px max(4vw,14px);max-width:900px}
.panel h2{font:900 34px/1.05 'Big Shoulders Display',sans-serif;margin:0 0 8px}
.note{color:var(--mut);font-size:14px}
.list{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px}
.list li{display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:12px;padding:8px}
.list .th{width:54px;aspect-ratio:2/3;border-radius:6px;background:#0f4540 center/cover;flex:none}
.list .t{flex:1}
.list .t small{display:block;color:var(--mut);overflow-wrap:anywhere}
.ic{min-width:44px;min-height:44px;border-radius:10px;border:0;background:#ffffff14;color:var(--ink)}
form.add{display:grid;gap:10px;background:var(--bg2);padding:16px;border-radius:14px;margin-top:16px}
form.add input{min-height:44px;border-radius:10px;border:1px solid #1d4d49;background:var(--bg);color:var(--ink);padding:0 12px;font-size:16px}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.share input{flex:1 1 240px;min-height:44px;border-radius:10px;border:1px solid #1d4d49;background:var(--bg);color:var(--mut);padding:0 12px;font-size:14px}
.msg{padding:20px max(4vw,14px);color:var(--mut)}
#player{position:fixed;inset:0;z-index:50;background:#000e;display:none;flex-direction:column}
#player.open{display:flex}
#player .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
#player .bar b{flex:1;font-size:17px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 10px 10px}
#stage iframe,#stage video{width:100%;height:100%;max-width:1400px;border:0;border-radius:10px;background:#000}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cream);color:#1d1a10;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.card .img,.toast{transition:none}}
@media(max-width:600px){.logo img{height:36px}.logo span{font-size:24px}.hero{padding:0}.frame{max-width:100%;border-radius:0}.frame .foto{height:auto;width:100%}.badge img{height:34px}.badge span{font-size:20px}}
</style>
</head>

<script>
{
const API='https://archive.org/advancedsearch.php';
const ROWS=[
  ['Mais assistidos','collection:feature_films'],
  ['Comédia','collection:feature_films AND subject:(comedy)'],
  ['Terror','collection:feature_films AND subject:(horror)'],
  ['Ficção científica','collection:feature_films AND subject:("science fiction" OR sci-fi)'],
  ['Film noir','collection:film_noir'],
  ['Faroeste','collection:feature_films AND subject:(western)'],
  ['Cinema mudo','collection:silent_films'],
  ['Desenhos clássicos','collection:animationandcartoons']
];
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lista=store.get('cl_lista',[]);
let meus=store.get('cl_meus',[]);
let fila=[],pos=0,view='inicio';
const cache={};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
const thumb=it=>it.img||(it.src==='ia'?`https://archive.org/services/img/${encodeURIComponent(it.id)}`:'');

async function busca(q,rows=24){
  if(cache[q+rows])return cache[q+rows];
  const p=new URLSearchParams({q:q+' AND mediatype:(movies)',rows,page:1,output:'json'});
  ['identifier','title','year','description'].forEach(f=>p.append('fl[]',f));
  p.append('sort[]','downloads desc');
  const r=await fetch(API+'?'+p);
  if(!r.ok)throw new Error('rede');
  const d=await r.json();
  const out=(d.response?.docs||[]).map(x=>({src:'ia',id:x.identifier,title:Array.isArray(x.title)?x.title[0]:x.title||x.identifier,year:x.year||'',desc:String(Array.isArray(x.description)?x.description[0]:x.description||'').replace(/<[^>]*>/g,' ').trim()}));
  return cache[q+rows]=out;
}

function card(it,i,grp){
  return `<button class="card" data-g="${grp}" data-i="${i}"><div class="img" style="background-image:url('${esc(thumb(it))}')"></div><b>${esc(it.title)}</b><small>${esc(it.year)}</small></button>`;
}
const groups={};
function bindCards(){
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const g=groups[b.dataset.g];abrir(g,+b.dataset.i)});
}

async function inicio(){
  const f=$('#trem').src;
  app.innerHTML='<section class="hero" id="hero"><img class="blur" alt="" src="'+f+'"><div class="frame"><img class="foto" src="'+f+'" alt="Vale CineLivre: trem de passageiros da Vale ao pôr do sol"></div></section><div class="cta"><button class="btn play" id="hp" disabled>▶ Assistir agora</button><button class="btn ghost" id="hb">🔍 Explorar filmes</button><div class="now" id="now">Carregando o filme em destaque…</div></div><div class="stripes"></div><div class="stats"><div><b>Gratuito</b>sem cadastro e sem mensalidade</div><div><b>+ de 10 mil</b>filmes em domínio público</div><div><b>Qualquer tela</b>celular, computador e TV</div></div><div id="rows"></div>';
  $('#hb').onclick=()=>{$('#q').focus();$('#rows').scrollIntoView({behavior:'smooth'})};
  const rowsEl=$('#rows');
  rowsEl.innerHTML=ROWS.map((r,k)=>`<section class="row"><h2>${r[0]}</h2><div class="strip" id="r${k}"><p class="note">Carregando…</p></div></section>`).join('');
  ROWS.forEach(async([nome,q],k)=>{
    try{
      const its=await busca(q,20);
      if(view!=='inicio')return;
      groups['r'+k]=its;
      $('#r'+k).innerHTML=its.map((it,i)=>card(it,i,'r'+k)).join('')||'<p class="note">Nada encontrado.</p>';
      bindCards();
      if(k===0&&its[0])hero(its[0],'r0');
    }catch(e){const el=$('#r'+k);if(el)el.innerHTML='<p class="note">Não foi possível carregar. Verifique a internet.</p>'}
  });
}
function hero(it,g){
  const hp=$('#hp');if(!hp)return;
  hp.disabled=false;hp.onclick=()=>abrir(groups[g],0);
  $('#now').innerHTML=`Em destaque hoje: <b>${esc(it.title)}</b>${it.year?' ('+esc(it.year)+')':''}`;
}

async function buscar(q){
  view='busca';marcarNav();
  app.innerHTML=`<div class="panel"><h2>Resultados para “${esc(q)}”</h2></div><div class="grid" id="res"><p class="note">Buscando…</p></div>`;
  try{
    const its=await busca(`(${q}) AND (collection:feature_films OR collection:silent_films OR collection:film_noir OR collection:animationandcartoons OR collection:classic_tv)`,48);
    groups.busca=its;
    $('#res').innerHTML=its.length?its.map((it,i)=>card(it,i,'busca')).join(''):'<p class="note">Nenhum filme encontrado. Tente outro nome, de preferência em inglês.</p>';
    bindCards();
  }catch(e){$('#res').innerHTML='<p class="note">Erro ao buscar. Verifique a internet.</p>'}
}

const chave=it=>it.src+':'+it.id;
const naLista=it=>lista.some(x=>chave(x)===chave(it));
function toggleLista(it){
  if(naLista(it)){lista=lista.filter(x=>chave(x)!==chave(it));toast('Removido da lista')}
  else{lista.push({src:it.src,id:it.id,title:it.title,year:it.year,img:it.img||''});toast('Adicionado à Minha lista')}
  store.set('cl_lista',lista);
}

function linkLista(){
  const data=lista.map(x=>[x.src,x.id,x.title,x.year||'']);
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.href.split('#')[0]+'#lista'+b;
}
function lerLinkLista(){
  const h=location.hash;
  if(!h.startsWith('#lista')||h.length<8)return;
  try{
    let b=h.slice(6).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const data=JSON.parse(decodeURIComponent(escape(atob(b))));
    const novos=data.map(([src,id,title,year])=>({src,id,title,year}));
    let n=0;novos.forEach(it=>{if(!naLista(it)){lista.push(it);n++}});
    store.set('cl_lista',lista);
    history.replaceState(null,'',location.href.split('#')[0]);
    view='lista';toast(n?`${n} vídeo(s) recebidos na sua lista`:'Você já tinha essa lista');
  }catch(e){}
}

function telaLista(){
  groups.lista=lista;
  app.innerHTML=`<div class="panel"><h2>Minha lista</h2><p class="note">Sua sequência de reprodução. Ela toca em ordem, um vídeo atrás do outro. Use as setas para reordenar.</p>
  ${lista.length?`<div class="share"><button class="btn red" id="tudo">▶ Tocar tudo</button><button class="btn ghost" id="emb">🔀 Embaralhar</button></div>
  <ul class="list">${lista.map((it,i)=>`<li><div class="th" style="background-image:url('${esc(thumb(it))}')"></div><div class="t"><b>${esc(it.title)}</b><small>${esc(it.year||rotulo(it))}</small></div>
  <button class="ic" data-a="play" data-i="${i}" aria-label="Assistir">▶</button><button class="ic" data-a="up" data-i="${i}" aria-label="Subir">↑</button><button class="ic" data-a="down" data-i="${i}" aria-label="Descer">↓</button><button class="ic" data-a="del" data-i="${i}" aria-label="Remover">✕</button></li>`).join('')}</ul>
  <h2 style="font-size:24px;margin-top:24px">Compartilhar com todo mundo</h2><p class="note">Envie este link por WhatsApp ou e-mail. Quem abrir recebe a mesma lista, no celular ou no computador.</p>
  <div class="share"><input id="lk" readonly value="${esc(linkLista())}" aria-label="Link da lista"><button class="btn play" id="cp">Copiar link</button></div>`
  :'<p class="note" style="margin-top:20px">Sua lista está vazia. Abra um filme e toque em “+ Minha lista”.</p>'}</div>`;
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,a=b.dataset.a;
    if(a==='play')return abrir(lista,i);
    if(a==='del')lista.splice(i,1);
    if(a==='up'&&i>0)[lista[i-1],lista[i]]=[lista[i],lista[i-1]];
    if(a==='down'&&i<lista.length-1)[lista[i+1],lista[i]]=[lista[i],lista[i+1]];
    store.set('cl_lista',lista);telaLista();
  });
  if(lista.length){
    $('#tudo').onclick=()=>abrir(lista,0);
    $('#emb').onclick=()=>{const c=[...lista];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}abrir(c,0)};
    $('#cp').onclick=async()=>{const i=$('#lk');try{await navigator.clipboard.writeText(i.value);toast('Link copiado!')}catch(e){i.select();document.execCommand&&document.execCommand('copy');toast('Link selecionado, copie manualmente')}};
  }
}

function rotulo(it){return {yt:'YouTube',mp4:'Vídeo direto',ia:'Internet Archive'}[it.src]||''}
function lerUrl(u){
  u=u.trim();let m;
  if(m=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))return{src:'yt',id:m[1],img:`https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg`};
  if(m=u.match(/archive\.org\/(?:details|embed)\/([^/?#]+)/))return{src:'ia',id:decodeURIComponent(m[1])};
  if(/^https?:\/\/.+\.(mp4|webm|ogg|m4v)(\?.*)?$/i.test(u))return{src:'mp4',id:u};
  return null;
}
function telaMeus(){
  groups.meus=meus;
  app.innerHTML=`<div class="panel"><h2>Meus vídeos</h2><p class="note">Adicione vídeos que você tem direito de exibir: links do YouTube, do Internet Archive ou de arquivos .mp4 hospedados por você.</p>
  <form class="add" id="fa"><input id="ft" placeholder="Título (opcional)" aria-label="Título"><input id="fu" placeholder="Cole o link do vídeo" aria-label="Link do vídeo" required><button class="btn red">Adicionar</button></form>
  <ul class="list">${meus.map((it,i)=>`<li><div class="th" style="background-image:url('${esc(thumb(it))}')"></div><div class="t"><b>${esc(it.title)}</b><small>${rotulo(it)}</small></div>
  <button class="ic" data-a="play" data-i="${i}" aria-label="Assistir">▶</button><button class="ic" data-a="lst" data-i="${i}" aria-label="Pôr na lista">＋</button><button class="ic" data-a="del" data-i="${i}" aria-label="Remover">✕</button></li>`).join('')}</ul></div>`;
  $('#fa').onsubmit=e=>{
    e.preventDefault();
    const it=lerUrl($('#fu').value);
    if(!it)return toast('Link não reconhecido');
    it.title=$('#ft').value.trim()||(it.src==='mp4'?it.id.split('/').pop():it.id);
    meus.unshift(it);store.set('cl_meus',meus);telaMeus();toast('Vídeo adicionado');
  };
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,a=b.dataset.a;
    if(a==='play')return abrir(meus,i);
    if(a==='lst'){if(!naLista(meus[i]))toggleLista(meus[i]);else toast('Já está na lista');return}
    if(a==='del'){meus.splice(i,1);store.set('cl_meus',meus);telaMeus()}
  });
}

function abrir(lst,i){fila=lst;pos=i;tocar();$('#player').classList.add('open');document.body.style.overflow='hidden'}
function tocar(){
  const it=fila[pos];if(!it)return;
  $('#pTitle').textContent=`${it.title}${fila.length>1?`  (${pos+1}/${fila.length})`:''}`;
  const st=$('#stage');
  if(it.src==='mp4'){
    st.innerHTML=`<video controls autoplay playsinline src="${esc(it.id)}"></video>`;
    st.querySelector('video').onended=()=>prox(1);
  }else{
    const src=it.src==='yt'?`https://www.youtube.com/embed/${it.id}?autoplay=1&rel=0`:`https://archive.org/embed/${encodeURIComponent(it.id)}`;
    st.innerHTML=`<iframe src="${src}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>`;
  }
  const add=$('#pAdd');if(add)add.remove();
  const b=document.createElement('button');b.className='btn ghost';b.id='pAdd';
  b.textContent=naLista(it)?'✓ Na lista':'+ Minha lista';
  b.onclick=()=>{toggleLista(it);b.textContent=naLista(it)?'✓ Na lista':'+ Minha lista'};
  $('#pClose').before(b);
}
function prox(d){const n=pos+d;if(n<0||n>=fila.length)return toast(d>0?'Fim da sequência':'Este é o primeiro');pos=n;tocar()}
function fechar(){$('#player').classList.remove('open');$('#stage').innerHTML='';document.body.style.overflow='';if(view==='lista')telaLista()}
$('#pNext').onclick=()=>prox(1);
$('#pPrev').onclick=()=>prox(-1);
$('#pClose').onclick=fechar;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#player').classList.contains('open'))fechar()});

function marcarNav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}
function ir(v){view=v;marcarNav();window.scrollTo(0,0);({inicio,lista:telaLista,meus:telaMeus})[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>ir(b.dataset.v));
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();q?buscar(q):ir('inicio')};

lerLinkLista();
ir(view);
}
</script>
</body>
</html>
